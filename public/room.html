<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PromptCollab room</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="room">
    <header class="topbar">
      <a class="logo" href="/" aria-label="PromptCollab home">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="6" fill="currentColor"/><path d="M10 13l4 3-4 3" stroke="var(--paper)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="17" y="10" width="2.4" height="12" rx="1.2" fill="#3d6bff"/><rect x="21" y="10" width="2.4" height="12" rx="1.2" fill="#e8457c"/></svg>
        <span>PromptCollab</span>
      </a>
      <input class="room-name" id="roomName" aria-label="Room name" value="Untitled prompt" maxlength="80">
      <div class="spacer"></div>
      <span class="status" id="status" data-state="connecting"><span>Connecting</span></span>
      <div class="avatars" id="avatars" aria-label="People in this room"></div>
      <button class="btn ghost small" id="shareBtn" type="button">Copy invite link</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <main class="thread-wrap" id="threadWrap">
      <div class="thread" id="thread"></div>
    </main>

    <div class="composer-wrap">
      <section class="composer" aria-label="Shared prompt">
        <div class="composer-head">
          <span id="writing" class="writing"></span>
          <div class="spacer"></div>
          <button class="toggle-system" id="toggleSystem" type="button" aria-expanded="false">Add system prompt</button>
        </div>
        <div class="system-box" id="systemBox" hidden>
          <div class="editor small" id="systemEditor">
            <div class="backdrop"><div class="mirror"></div></div>
            <textarea spellcheck="false" placeholder="Shared instructions the model sees before every message (role, tone, rules)…" aria-label="Shared system prompt"></textarea>
          </div>
        </div>
        <div class="editor" id="promptEditor">
          <div class="backdrop"><div class="mirror"></div></div>
          <textarea spellcheck="false" placeholder="Write the prompt together. Everyone in this room sees each keystroke." aria-label="Shared prompt"></textarea>
        </div>
        <div class="composer-foot">
          <select class="model-select" id="modelSelect" aria-label="Model"></select>
          <span class="tokens" id="tokens">0 tokens</span>
          <div class="spacer"></div>
          <span class="kbd">Ctrl + Enter</span>
          <button class="btn" id="sendBtn" type="button">Send to model</button>
        </div>
      </section>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog id="codeDialog">
    <form method="dialog" id="codeForm">
      <h2>Access code needed</h2>
      <p>This server is private. Ask whoever runs it for the access code.</p>
      <input type="password" id="codeInput" required placeholder="Access code">
      <div class="dialog-actions" style="margin-top:16px"><button class="btn" type="submit">Continue</button></div>
    </form>
  </dialog>

  <script type="module" src="/js/room.js"></script>
</body>
</html>
