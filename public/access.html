<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private site · PromptCollab</title>
  <!--meta-->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="auth-page">
    <header>
      <a class="logo" href="/"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22" rx="6" fill="currentColor"/><path d="M10 13l4 3-4 3" stroke="var(--paper)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="17" y="10" width="2.4" height="12" rx="1.2" fill="#3d6bff"/><rect x="21" y="10" width="2.4" height="12" rx="1.2" fill="#e8457c"/></svg> PromptCollab</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>

    <a class="back-link" id="backLink" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span id="backText">Back to the home page</span>
    </a>

    <main class="auth-card">
      <span class="gate-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <h1>This site is private</h1>
      <p class="auth-sub">Enter the access code you got from whoever runs it. You'll only need to do this once on this browser.</p>

      <form id="accessForm" novalidate>
        <div class="field">
          <label for="code">Access code</label>
          <div class="key-input">
            <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
            <button class="btn ghost small" type="button" id="showCode" aria-pressed="false">Show</button>
          </div>
        </div>
        <p class="form-error" id="formError" role="alert"></p>
        <button class="btn auth-submit" type="submit">Continue</button>
      </form>

      <p class="auth-switch fineprint">Just looking? You can still browse the <a href="/">home page</a>, <a href="/about">About</a>, <a href="/faq">FAQ</a> and <a href="/privacy">Privacy</a> without a code.</p>
    </main>
  </div>
  <script type="module" src="/js/access.js"></script>
</body>
</html>
